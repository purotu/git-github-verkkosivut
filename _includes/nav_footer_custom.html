<button id="theme-toggle" type="button" class="theme-toggle-btn">
  <span id="theme-toggle-label">Vaihda vaaleaan teemaan</span>
</button>
<script>
(function() {
  var STORAGE_KEY = 'jtd-color-scheme';
  var btn = document.getElementById('theme-toggle');
  var label = document.getElementById('theme-toggle-label');

  function current() {
    return localStorage.getItem(STORAGE_KEY) || 'custom';
  }

  function updateLabel() {
    label.textContent = current() === 'light' ? 'Vaihda tummaan teemaan' : 'Vaihda vaaleaan teemaan';
  }

  updateLabel();

  btn.addEventListener('click', function() {
    var next = current() === 'light' ? 'custom' : 'light';
    localStorage.setItem(STORAGE_KEY, next);
    jtd.setTheme(next);
    updateLabel();
  });
})();
</script>
