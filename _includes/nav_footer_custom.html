<button type="button" class="theme-toggle-btn">
  <span class="theme-toggle-label">Vaihda vaaleaan teemaan</span>
</button>
<script>
(function() {
  var STORAGE_KEY = 'jtd-color-scheme';

  function current() {
    return localStorage.getItem(STORAGE_KEY) || 'custom';
  }

  function updateLabels() {
    var text = current() === 'light' ? 'Vaihda tummaan teemaan' : 'Vaihda vaaleaan teemaan';
    document.querySelectorAll('.theme-toggle-label').forEach(function(el) {
      el.textContent = text;
    });
  }

  updateLabels();

  // Just the Docs renderöi tämän includen kahdesti (työpöytä + mobiili), joten sidotaan
  // klikkauskuuntelija jokaiseen nappiin vain kerran, ettei sama klikkaus kumoa itseään.
  document.querySelectorAll('.theme-toggle-btn').forEach(function(btn) {
    if (btn.dataset.themeToggleBound) return;
    btn.dataset.themeToggleBound = 'true';
    btn.addEventListener('click', function() {
      var next = current() === 'light' ? 'custom' : 'light';
      localStorage.setItem(STORAGE_KEY, next);
      jtd.setTheme(next);
      updateLabels();
    });
  });
})();
</script>
