<!-- Tuo Ubuntu-fontti Google Fontsista custom.scss:n käyttämäksi -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Sovella tallennettu vaalea/tumma teemavalinta heti, ettei väärä teema välähdä ensin -->
<script>
(function() {
  var saved = localStorage.getItem('jtd-color-scheme');
  if (saved && window.jtd && typeof jtd.setTheme === 'function') {
    jtd.setTheme(saved);
  }
})();
</script>
